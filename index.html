
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EXIT CODE | 미션 관리</title>

<style>
:root {
  font-family: system-ui, 'Malgun Gothic', sans-serif;
  color: #172033;
  background: #f3f6fb;
}
* { box-sizing: border-box; }
body {
  max-width: 600px;
  margin: 30px auto;
  padding: 16px;
}
main {
  background: white;
  border-radius: 16px;
  padding: 24px;
}
h1 { margin: 0 0 6px; }
h2 { font-size: 21px; }
nav {
  display: flex;
  gap: 8px;
  margin: 20px 0;
}
button, input, select { font: inherit; }
nav button { flex: 1; }
button {
  padding: 12px 16px;
  background: #245cdb;
  color: white;
  border: 0;
  border-radius: 9px;
  cursor: pointer;
}
button:disabled {
  opacity: .5;
  cursor: wait;
}
button.secondary {
  background: #e8eef9;
  color: #20314f;
}
button.active { background: #153c99; }
label {
  display: block;
  margin: 14px 0 5px;
  font-weight: 600;
}
input, select {
  width: 100%;
  padding: 12px;
  border: 1px solid #aeb9cd;
  border-radius: 8px;
}
form > button {
  width: 100%;
  margin-top: 20px;
}
.hidden { display: none !important; }
.notice {
  margin-top: 12px;
  white-space: pre-wrap;
  color: #344361;
}
.error { color: #b42318; }
.ok { color: #146c43; }
.item {
  border: 1px solid #d8e0ed;
  border-radius: 10px;
  padding: 14px;
  margin: 10px 0;
  overflow-wrap: anywhere;
}
.item a { color: #245cdb; }
small { color: #65718a; }
.topline {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.topline button { width: auto; }
footer {
  margin-top: 22px;
  color: #65718a;
  font-size: 13px;
}
 .stage-grid { display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:9px 0 14px; }
.stage-pill {padding:9px 4px;border-radius:8px;text-align:center;font-size:13px;font-weight:700;border:1px solid #cbd5e1;}
.stage-pill.done {background:#dcfce7;color:#166534;border-color:#86efac;}
.stage-pill.wait {background:#f1f5f9;color:#475569;}
.stage-pill.retry {background:#fef3c7;color:#92400e;}
.stage-pill.paid {background:#15803d;color:white;border-color:#15803d;}
.stage-pill.unpaid {background:#e2e8f0;color:#334155;}
.stage-actions {display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;}
.stage-actions button {flex:1;min-width:100px;font-size:13px;padding:10px 6px;}
.stage-note {font-size:13px;color:#9a3412;font-weight:700;}
</style>
</head>

<body>
<main>
  <h1>EXIT CODE</h1>
  <small>1차시 미션 관리 · 현재 가상 학생 데이터 전용</small>

  <!-- 학생 / 도우미 선택 -->
  <nav aria-label="입장 유형">
    <button id="studentTab" class="active" type="button">
      학생 입장
    </button>
    <button id="helperTab" class="secondary" type="button">
      도우미 입장
    </button>
  </nav>

  <!-- 학생 화면 -->
  <section id="studentArea">
    <form id="studentForm">
      <h2>학생 입장</h2>
      <label for="classNum">반</label>
      <select id="classNum" required>
        <option value="1">1반</option><option value="2">2반</option>
        <option value="3">3반</option><option value="4">4반</option>
        <option value="5">5반</option>
      </select>
      <label for="studentNum">번호</label>
      <input id="studentNum" type="number" min="1" max="99" required>
      <label for="studentName">이름</label>
      <input id="studentName" maxlength="30" autocomplete="off" required>
      <button type="submit">입장 확인</button>
      <p id="studentResult" class="notice" role="status"></p>
    </form>
    <section id="missionArea" class="hidden">
      <div class="topline">
        <h2 id="studentTitle">나의 미션</h2>
        <button id="studentLogoutBtn" class="secondary" type="button">나가기</button>
      </div>
      <p><small>미션 1~2는 화면에서 연습 완료 표시만 합니다. 서버에는 저장되지 않습니다.</small></p>
      <div class="item"><strong>미션 1 · 복습</strong>
        <p><label><input type="checkbox" id="mission1Check" style="width:auto"> 연습 완료</label></p></div>
      <div class="item"><strong>미션 2 · 응용</strong>
        <p><label><input type="checkbox" id="mission2Check" style="width:auto"> 연습 완료</label></p></div>
      <h2>미션 3~5 제출</h2>
      <p><button id="studentRefreshBtn" class="secondary" type="button">내 미션 상태 새로고침</button></p>
      <p id="studentStatusResult" class="notice" role="status"></p>
      <div id="studentMissionStatus"></div>
      <form id="missionForm">
        <label for="missionNum">미션 선택</label>
        <select id="missionNum"><option value="3">미션 3</option>
          <option value="4">미션 4</option><option value="5">미션 5</option></select>
        <label for="makecodeUrl">MakeCode 공유 URL</label>
        <input id="makecodeUrl" type="url" placeholder="https://makecode.microbit.org/#pub:..." required>
        <button type="submit" id="missionSubmitBtn">미션 제출</button>
        <p id="submitResult" class="notice" role="status"></p>
      </form>
    </section>
  </section>

  <!-- 도우미 화면 -->
  <section id="helperArea" class="hidden">
    <form id="helperForm">
      <h2>도우미 로그인</h2>

      <label for="accountId">계정 ID</label>
      <input id="accountId" autocomplete="username"
             placeholder="helper01" required>

      <label for="helperPassword">비밀번호</label>
      <input id="helperPassword" type="password"
             autocomplete="current-password" required>

      <button type="submit">로그인</button>
      <p id="helperResult" class="notice" role="status"></p>
    </form>

    <!-- 로그인 성공 후 표시 -->
    <section id="helperDashboard" class="hidden">
      <div class="topline">
        <h2 id="helperTitle">미션 검수 목록</h2>
        <button id="logoutBtn" type="button" class="secondary">
          로그아웃
        </button>
      </div>

      <small>담당 반 제출 내역을 검수합니다.</small>

      <p>
        <button id="refreshBtn" type="button" class="secondary">
          목록 새로고침
        </button>
      </p>

      <p id="listResult" class="notice" role="status"></p>
      <div id="missionList"></div>
      
      <!-- 간식 지급 관리 -->
      <section id="snackArea" style="margin-top:30px;">
        <h2>학생별 미션·간식 현황</h2>
        <p><small>미션 1~2는 서버에 저장되지 않습니다. 3~5단계 검수와 지급 기록을 표시합니다.</small></p>

        <div style="margin:15px 0;">
          <label for="snackSearch">학생 검색</label>
          <input
            id="snackSearch"
            type="search"
            placeholder="번호 또는 이름 입력"
            autocomplete="off"
          >
        
          <label for="snackFilter">지급 상태</label>
          <select id="snackFilter">
            <option value="all">전체 학생</option>
            <option value="ready">지급 대기</option>
            <option value="done">지급 완료</option>
            <option value="progress">미션 진행 중</option>
          </select>
        </div>
        
        <p id="snackResult" class="notice" role="status"></p>
        <div id="snackList"></div>
      </section>

    </section>
  </section>

  <footer>
    실제 학생 정보와 운영용 비밀번호는 아직 입력하지 마세요.
  </footer>
</main>

<script>
'use strict';

// 기존 Apps Script 주소 유지
const API_URL =
  'https://script.google.com/macros/s/AKfycbzAtp31FIlNoPtN6Hd1ZsxPYZ3xyd-VMWTZXmTY8nmS_r-xQsw6lQedVDYXwJEF_1ms/exec';

const $ = id => document.getElementById(id);

// 세션 토큰은 브라우저 메모리에만 저장
let helperToken = '';
let helperClass = '';

const show = (id, on) =>
  $(id).classList.toggle('hidden', !on);

function status(id, message, ok) {
  const el = $(id);
  el.textContent = message;
  el.className = 'notice ' +
    (ok === true ? 'ok' : ok === false ? 'error' : '');
}

// 학생 / 도우미 화면 전환
function switchTab(helper) {
  show('studentArea', !helper);
  show('helperArea', helper);

  $('studentTab').className =
    helper ? 'secondary' : 'active';

  $('helperTab').className =
    helper ? 'active' : 'secondary';
}

$('studentTab').addEventListener('click', () => switchTab(false));
$('helperTab').addEventListener('click', () => switchTab(true));

// POST 통신 공통 함수
async function post(data) {
  const r = await fetch(API_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'text/plain;charset=utf-8'
    },
    body: JSON.stringify(data)
  });

  if (!r.ok) {
    throw new Error('HTTP ' + r.status);
  }

  return r.json();
}

// 학생 세션은 메모리에만 보관 (새로고침하면 재로그인)
let studentToken = '';
let studentMissions = [];

function resetStudent() {
  studentToken = '';
  studentMissions = [];
  show('studentForm', true);
  show('missionArea', false);
  $('studentMissionStatus').replaceChildren();
  $('makecodeUrl').value = '';
  $('mission1Check').checked = false;
  $('mission2Check').checked = false;
}

$('studentForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = e.submitter;
  btn.disabled = true;
  status('studentResult', '학생 정보 확인 중...');
  try {
    const data = await post({
      action:'studentLogin',classNum:$('classNum').value,
      studentNum:$('studentNum').value,studentName:$('studentName').value.trim()
    });
    status('studentResult', data.message || '입장 실패', !!data.success);
    if (!data.success) return;
    studentToken = data.token;
    $('studentTitle').textContent = data.student.classNum+'반 '+data.student.number+'번 '+data.student.name;
    show('studentForm', false);
    show('missionArea', true);
    await loadStudentStatus();
  } catch (err) {
    status('studentResult','학생 입장 요청을 확인하지 못했습니다.',false);
    console.error(err);
  } finally {btn.disabled=false;}
});

async function loadStudentStatus() {
  if (!studentToken) return;
  status('studentStatusResult','미션 상태 확인 중...');
  try {
    const data = await post({action:'studentStatus',token:studentToken});
    if (!data.success) {
      status('studentStatusResult',data.message || '조회 실패',false);
      if (/만료/.test(data.message || '')) resetStudent();
      return;
    }
    studentMissions = data.missions || [];
    renderStudentStatus();
  } catch(err) {
    status('studentStatusResult','상태를 불러오지 못했습니다.',false);
    console.error(err);
  }
}

function renderStudentStatus() {
  const list = $('studentMissionStatus');
  list.replaceChildren();
  for (const mission of [3,4,5]) {
    const item = studentMissions.find(x=>Number(x.mission)===mission);
    const card = document.createElement('div');
    card.className='item';
    const strong=document.createElement('strong');
    strong.textContent='미션 '+mission+' · '+(item?item.status:'미제출');
    card.append(strong);
    if (item && item.status==='재도전') {
      const p=document.createElement('p');
      p.textContent='코드를 수정한 뒤 해당 미션을 선택해 다시 제출하세요.';
      card.append(p);
    }
    list.append(card);
  }
  status('studentStatusResult','미션 상태 확인 완료',true);
  updateStudentSubmit();
}

function updateStudentSubmit() {
  const mission=Number($('missionNum').value);
  const item=studentMissions.find(x=>Number(x.mission)===mission);
  const allowed=!item || item.status==='재도전';
  $('missionSubmitBtn').disabled=!allowed;
  $('missionSubmitBtn').textContent=item && item.status==='재도전'?'재도전 제출':'미션 제출';
  if (!allowed) status('submitResult','이 미션은 '+item.status+' 상태입니다. 재제출할 수 없습니다.');
  else status('submitResult','');
}
$('missionNum').addEventListener('change',updateStudentSubmit);
$('studentRefreshBtn').addEventListener('click',loadStudentStatus);
$('studentLogoutBtn').addEventListener('click',async()=>{
  const token=studentToken;
  resetStudent();
  status('studentResult','학생 화면에서 나왔습니다.',true);
  try {await post({action:'studentLogout',token});} catch(err){console.error(err);}
});

$('missionForm').addEventListener('submit',async e=>{
  e.preventDefault();
  if (!studentToken) return;
  const btn=e.submitter;
  btn.disabled=true;
  status('submitResult','제출 중...');
  try {
    const data=await post({action:'submitMission',token:studentToken,
      mission:Number($('missionNum').value),url:$('makecodeUrl').value.trim()});
    status('submitResult',data.message || '제출 실패',!!data.success);
    if (data.success) {
      $('makecodeUrl').value='';
      await loadStudentStatus();
      status('submitResult',data.message,true);
    } else if (/만료/.test(data.message || '')) resetStudent();
    else btn.disabled=false;
  } catch(err) {
    status('submitResult','제출 결과를 확인하지 못했습니다. 상태를 새로고침한 후 다시 시도해 주세요.',false);
    console.error(err);
  }
});

// 도우미 로그인
$('helperForm').addEventListener('submit', async e => {
  e.preventDefault();

  const btn = e.submitter;
  btn.disabled = true;

  status('helperResult', '로그인 중...');

  try {
    const data = await post({
      action: 'helperLogin',
      accountId: $('accountId').value.trim(),
      password: $('helperPassword').value
    });

    if (!data.success) {
      status(
        'helperResult',
        data.message || '로그인 실패',
        false
      );
      return;
    }

    helperToken = data.token;
    helperClass = data.classNum;

    $('helperPassword').value = '';

    show('helperForm', false);
    show('helperDashboard', true);

    $('helperTitle').textContent =
      helperClass + '반 미션 검수 목록';

    await loadList();
    await loadSnackList();

  } catch (err) {
    status(
      'helperResult',
      '로그인 응답을 읽지 못했습니다.',
      false
    );
    console.error(err);
  } finally {
    btn.disabled = false;
  }
});

// 도우미 담당 반 미션 목록 조회
async function loadList() {
  if (!helperToken) return;

  status('listResult', '제출 목록 확인 중...');
  $('missionList').replaceChildren();

  try {
    const data = await post({
      action: 'helperMissionList',
      token: helperToken
    });

    if (!data.success) {
      status(
        'listResult',
        data.message || '조회 실패',
        false
      );

      if (/만료/.test(data.message || '')) {
        resetHelper();
      }
      return;
    }

    const items = data.missions || [];

    status(
      'listResult',
      items.length + '건 조회 완료',
      true
    );

    for (const item of items) {
      const card = document.createElement('div');
      card.className = 'item';

      const header = document.createElement('strong');
      header.textContent =
        item.number + '번 ' + item.name +
        ' · 미션 ' + item.mission +
        ' · ' + item.status;

      card.append(header);

      const p = document.createElement('p');
      const a = document.createElement('a');

      try {
        const u = new URL(item.url);

        if (
          u.protocol === 'https:' &&
          u.hostname === 'makecode.microbit.org'
        ) {
          a.href = u.href;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.textContent = 'MakeCode 코드 확인';
          p.append(a);
        } else {
          p.textContent = '공유 URL 확인 필요';
        }
      } catch {
        p.textContent = '공유 URL 확인 필요';
      }

     
card.append(p);

// 검수 버튼 영역
const actions = document.createElement('div');
actions.style.display = 'flex';
actions.style.gap = '8px';
actions.style.flexWrap = 'wrap';

const currentStatus = String(item.status || '');
const submissionId = String(item.submissionId || '');

function addReviewButton(label, reviewAction) {
  const button = document.createElement('button');

  button.type = 'button';
  button.textContent = label;
  button.style.flex = '1';
  button.style.minWidth = '90px';

  button.addEventListener('click', async () => {
    if (!confirm(
      item.number + '번 미션 ' + item.mission +
      '을(를) ' + label + ' 처리할까요?'
    )) {
      return;
    }

    // 처리 중 중복 클릭 방지
    actions.querySelectorAll('button').forEach(btn => {
      btn.disabled = true;
    });

    status('listResult', '검수 처리 중...');

    try {
      const result = await post({
        action: 'helperReviewMission',
        token: helperToken,
        submissionId: submissionId,
        reviewAction: reviewAction
      });

      if (result.success) {
        // 처리 후 서버에서 최신 목록 다시 조회
        await loadList();
        await loadSnackList();
      } else {
        status(
          'listResult',
          result.message || '검수 처리 실패',
          false
        );

        actions.querySelectorAll('button').forEach(btn => {
          btn.disabled = false;
        });
      }

    } catch (error) {
      console.error(error);

      status(
        'listResult',
        '검수 결과를 확인하지 못했습니다. 목록을 새로고침해 상태를 확인해 주세요.',
        false
      );

      // 결과를 알 수 없으므로 즉시 재처리하지 않도록 유지
    }
  });

  actions.append(button);
}

if (currentStatus === '대기') {
  addReviewButton('승인', 'approve');
  addReviewButton('재도전', 'retry');
}

if (
  currentStatus === '승인' ||
  currentStatus === '재도전'
) {
  addReviewButton('검수 취소', 'cancel');
}

card.append(actions);
$('missionList').append(card);

    }

  } catch (err) {
    status(
      'listResult',
      '목록을 불러오지 못했습니다.',
      false
    );
    console.error(err);
  }
}

// 도우미 화면 초기화
function resetHelper() {
  helperToken = '';
  helperClass = '';

  show('helperDashboard', false);
  show('helperForm', true);
  $('missionList').replaceChildren();
  $('snackList').replaceChildren();
}

// 목록 새로고침
$('refreshBtn').addEventListener('click', async () => {
  await loadList();
  await loadSnackList();
});

// 도우미 로그아웃
$('logoutBtn').addEventListener('click', async () => {
  const token = helperToken;

  resetHelper();
  status('helperResult', '로그아웃했습니다.', true);

  try {
    await post({
      action: 'helperLogout',
      token: token
    });
  } catch (err) {
    console.error('서버 로그아웃 응답 확인 실패', err);
    status(
      'helperResult',
      '화면에서 로그아웃했지만 서버 세션 종료를 확인하지 못했습니다.',
      false
    );
  }
});

  
/**
 * 담당 반 간식 지급 현황 조회
 */

let snackStudents=[];
async function loadSnackList() {
  if(!helperToken) return;
  status('snackResult','학생별 현황 확인 중...');
  try {
    const data=await post({action:'helperSnackList',token:helperToken});
    if(!data.success) {status('snackResult',data.message||'조회 실패',false);return;}
    snackStudents=data.students||[];
    renderSnackList();
  } catch(err) {console.error(err);status('snackResult','현황을 불러오지 못했습니다.',false);}
}
function addStagePill(parent,stage,label,kind) {
  const pill=document.createElement('div');
  pill.className='stage-pill '+kind;
  pill.textContent=stage+'단계 '+label;
  parent.append(pill);
}
function renderSnackList() {
  const keyword=$('snackSearch').value.trim().toLowerCase();
  const filter=$('snackFilter').value;
  const list=$('snackList');list.replaceChildren();
  const filtered=snackStudents.filter(s=>{
    const match=String(s.number).includes(keyword)||String(s.name).toLowerCase().includes(keyword);
    const ready=[3,4,5].some(n=>s.missions[n]==='승인'&&s.snacks[n]!=='지급완료');
    const done=[3,4,5].some(n=>s.snacks[n]==='지급완료');
    const progress=![3,4,5].every(n=>s.missions[n]==='승인');
    return match && (filter==='all'||(filter==='ready'&&ready)||(filter==='done'&&done)||(filter==='progress'&&progress));
  });
  status('snackResult','검색 결과 '+filtered.length+'명 / 전체 '+snackStudents.length+'명',true);
  if(!filtered.length) {const p=document.createElement('p');p.textContent='해당하는 학생이 없습니다.';list.append(p);return;}
  for(const s of filtered) {
    const card=document.createElement('div');card.className='item';
    const title=document.createElement('strong');title.textContent=s.number+'번 '+s.name;card.append(title);
    const mTitle=document.createElement('p');mTitle.textContent='미션 검수 현황';card.append(mTitle);
    const mGrid=document.createElement('div');mGrid.className='stage-grid';
    for(const n of [3,4,5]) {
      const state=s.missions[n]||'미제출';
      addStagePill(mGrid,n,state,state==='승인'?'done':state==='재도전'?'retry':'wait');
    }
    card.append(mGrid);
    const sTitle=document.createElement('p');sTitle.textContent='간식 지급 현황';card.append(sTitle);
    const sGrid=document.createElement('div');sGrid.className='stage-grid';
    for(const n of [3,4,5]) {
      const paid=s.snacks[n]==='지급완료';
      addStagePill(sGrid,n,paid?'지급':'미지급',paid?'paid':'unpaid');
    }
    card.append(sGrid);
    if(s.missions[5]==='승인' && s.missions[4]!=='승인') {
      const p=document.createElement('p');p.className='stage-note';
      p.textContent='※ 4단계 미완료 · 5단계 승인 → 5단계 지급 시 4단계 수준 간식 제공';card.append(p);
    }
    const actions=document.createElement('div');actions.className='stage-actions';
    for(const n of [3,4,5]) {
      const paid=s.snacks[n]==='지급완료';
      const approved=s.missions[n]==='승인';
      if(!paid && !approved) continue;
      const btn=document.createElement('button');btn.type='button';
      btn.className=paid?'secondary':'';
      btn.textContent=n+'단계 '+(paid?'지급 취소':'지급완료');
      btn.addEventListener('click',async()=>{
        const tier=n===5 && s.missions[4]!=='승인'?4:n;
        const msg=paid ? n+'단계 지급 기록을 취소할까요? (실제 간식 회수 아님)' :
          n+'단계 미션 간식을 실제 전달했나요?\n제공할 간식: '+tier+'단계 수준';
        if(!confirm(s.number+'번 '+s.name+'\n'+msg)) return;
        actions.querySelectorAll('button').forEach(b=>b.disabled=true);
        status('snackResult','간식 처리 중...');
        try {
          const result=await post({action:'helperSnack',token:helperToken,studentId:s.studentId,
            snackStage:n,snackAction:paid?'cancel':'give'});
          if(result.success) await loadSnackList();
          else {status('snackResult',result.message||'처리 실패',false);actions.querySelectorAll('button').forEach(b=>b.disabled=false);}
        } catch(err) {console.error(err);status('snackResult','처리 결과를 확인하지 못했습니다. 새로고침 후 확인해 주세요.',false);}
      });
      actions.append(btn);
    }
    card.append(actions);list.append(card);
  }
}

// 검색어 입력 즉시 반영
const snackSearchInput = $('snackSearch');
// 지급 상태 변경 즉시 반영
const snackFilterSelect = $('snackFilter');

if (snackSearchInput && snackFilterSelect) {
  snackSearchInput.addEventListener('input', renderSnackList);
  snackFilterSelect.addEventListener('change', renderSnackList);
}





</script>

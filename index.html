
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EXIT CODE | 입장 테스트</title>

<style>
:root {
  font-family: system-ui, 'Malgun Gothic', sans-serif;
  color: #172033;
  background: #f3f6fb;
}
* { box-sizing: border-box; }
body {
  max-width: 600px;
  margin: 30px auto;
  padding: 16px;
}
main {
  background: white;
  border-radius: 16px;
  padding: 24px;
  box-shadow: 0 5px 20px #13264b12;
}
h1 { margin: 0 0 6px; }
h2 { font-size: 21px; }
nav {
  display: flex;
  gap: 8px;
  margin: 20px 0;
}
button, input, select { font: inherit; }
nav button { flex: 1; }
button {
  padding: 12px 16px;
  background: #245cdb;
  color: white;
  border: 0;
  border-radius: 9px;
  cursor: pointer;
}
button:disabled {
  opacity: .5;
  cursor: wait;
}
button.secondary {
  background: #e8eef9;
  color: #20314f;
}
button.active { background: #153c99; }
label {
  display: block;
  margin: 14px 0 5px;
  font-weight: 600;
}
input, select {
  width: 100%;
  padding: 12px;
  border: 1px solid #aeb9cd;
  border-radius: 8px;
}
form > button {
  width: 100%;
  margin-top: 20px;
}
.hidden { display: none !important; }
.notice {
  margin-top: 12px;
  white-space: pre-wrap;
  color: #344361;
}
.error { color: #b42318; }
.ok { color: #146c43; }
.item {
  border: 1px solid #d8e0ed;
  border-radius: 10px;
  padding: 14px;
  margin: 10px 0;
  overflow-wrap: anywhere;
}
.item a { color: #245cdb; }
small { color: #65718a; }
.topline {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.topline button { width: auto; }
footer {
  margin-top: 22px;
  color: #65718a;
  font-size: 13px;
}
</style>
</head>

<body>
<main>
  <h1>EXIT CODE</h1>
  <small>1차시 기능 테스트 · 가상 학생 데이터 전용</small>

  <!-- 학생 / 도우미 선택 -->
  <nav aria-label="입장 유형">
    <button id="studentTab" class="active" type="button">
      학생 입장
    </button>
    <button id="helperTab" class="secondary" type="button">
      도우미 입장
    </button>
  </nav>

  <!-- 학생 화면 -->
  <section id="studentArea">
    <form id="studentForm">
      <h2>학생 입장 확인</h2>

      <label for="classNum">반</label>
      <select id="classNum" required>
        <option value="1">1반</option>
        <option value="2">2반</option>
        <option value="3">3반</option>
        <option value="4">4반</option>
        <option value="5">5반</option>
      </select>

      <label for="studentNum">번호</label>
      <input id="studentNum" type="number"
             min="1" max="99" value="99" required>

      <label for="studentName">이름</label>
      <input id="studentName" maxlength="30"
             value="테스트학생" required>

      <button type="submit">입장 확인</button>
      <p id="studentResult" class="notice" role="status"></p>
    </form>

    <!-- 입장 확인 후 표시 -->
    <section id="missionArea" class="hidden">
      <h2>미션 제출 테스트</h2>
      <small>
        현재 서버는 1반 99번 테스트학생으로만 저장합니다.
      </small>

      <form id="missionForm">
        <label for="missionNum">미션 선택</label>
        <select id="missionNum">
          <option value="3">미션 3</option>
          <option value="4">미션 4</option>
          <option value="5">미션 5</option>
        </select>

        <label for="makecodeUrl">MakeCode 공유 URL</label>
        <input id="makecodeUrl" type="url"
               placeholder="https://makecode.microbit.org/#pub:..."
               required>

        <button type="submit">미션 제출</button>
        <p id="submitResult" class="notice" role="status"></p>
      </form>
    </section>
  </section>

  <!-- 도우미 화면 -->
  <section id="helperArea" class="hidden">
    <form id="helperForm">
      <h2>도우미 로그인</h2>

      <label for="accountId">계정 ID</label>
      <input id="accountId" autocomplete="username"
             placeholder="helper01" required>

      <label for="helperPassword">비밀번호</label>
      <input id="helperPassword" type="password"
             autocomplete="current-password" required>

      <button type="submit">로그인</button>
      <p id="helperResult" class="notice" role="status"></p>
    </form>

    <!-- 로그인 성공 후 표시 -->
    <section id="helperDashboard" class="hidden">
      <div class="topline">
        <h2 id="helperTitle">미션 검수 목록</h2>
        <button id="logoutBtn" type="button" class="secondary">
          로그아웃
        </button>
      </div>

      <small>
        현재는 조회 전용입니다.
        승인·재도전·검수 취소는 다음 단계에서 연결합니다.
      </small>

      <p>
        <button id="refreshBtn" type="button" class="secondary">
          목록 새로고침
        </button>
      </p>

      <p id="listResult" class="notice" role="status"></p>
      <div id="missionList"></div>
      
      <!-- 간식 지급 관리 -->
      <section id="snackArea" style="margin-top:30px;">
        <h2>간식 지급 관리</h2>

        <div style="margin:15px 0;">
          <label for="snackSearch">학생 검색</label>
          <input
            id="snackSearch"
            type="search"
            placeholder="번호 또는 이름 입력"
            autocomplete="off"
          >
        
          <label for="snackFilter">지급 상태</label>
          <select id="snackFilter">
            <option value="all">전체 학생</option>
            <option value="ready">지급 대기</option>
            <option value="done">지급 완료</option>
            <option value="progress">미션 진행 중</option>
          </select>
        </div>
        
        <!-- 간식 지급 검색 및 필터 -->
        <div style="margin:15px 0;">
          <label for="snackSearch">학생 검색</label>
          <input
            id="snackSearch"
            type="search"
            placeholder="번호 또는 이름 입력"
            autocomplete="off"
          >
        
          <label for="snackFilter">지급 상태</label>
          <select id="snackFilter">
            <option value="all">전체 학생</option>
            <option value="ready">지급 대기</option>
            <option value="done">지급 완료</option>
            <option value="progress">미션 진행 중</option>
          </select>
        </div>

        <p id="snackResult" class="notice" role="status"></p>
        <div id="snackList"></div>
      </section>

    </section>
  </section>

  <footer>
    실제 학생 정보와 운영용 비밀번호는 아직 입력하지 마세요.
  </footer>
</main>

<script>
'use strict';

// 기존 Apps Script 주소 유지
const API_URL =
  'https://script.google.com/macros/s/AKfycbzAtp31FIlNoPtN6Hd1ZsxPYZ3xyd-VMWTZXmTY8nmS_r-xQsw6lQedVDYXwJEF_1ms/exec';

const $ = id => document.getElementById(id);

// 세션 토큰은 브라우저 메모리에만 저장
let helperToken = '';
let helperClass = '';

const show = (id, on) =>
  $(id).classList.toggle('hidden', !on);

function status(id, message, ok) {
  const el = $(id);
  el.textContent = message;
  el.className = 'notice ' +
    (ok === true ? 'ok' : ok === false ? 'error' : '');
}

// 학생 / 도우미 화면 전환
function switchTab(helper) {
  show('studentArea', !helper);
  show('helperArea', helper);

  $('studentTab').className =
    helper ? 'secondary' : 'active';

  $('helperTab').className =
    helper ? 'active' : 'secondary';
}

$('studentTab').addEventListener('click', () => switchTab(false));
$('helperTab').addEventListener('click', () => switchTab(true));

// POST 통신 공통 함수
async function post(data) {
  const r = await fetch(API_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'text/plain;charset=utf-8'
    },
    body: JSON.stringify(data)
  });

  if (!r.ok) {
    throw new Error('HTTP ' + r.status);
  }

  return r.json();
}

// 학생 입장 확인
$('studentForm').addEventListener('submit', async e => {
  e.preventDefault();

  const btn = e.submitter;
  btn.disabled = true;

  show('missionArea', false);
  status('studentResult', '학생 정보 확인 중...');

  try {
    const url = new URL(API_URL);

    url.searchParams.set('action', 'checkStudent');
    url.searchParams.set('classNum', $('classNum').value);
    url.searchParams.set('studentNum', $('studentNum').value);
    url.searchParams.set(
      'studentName',
      $('studentName').value.trim()
    );

    const r = await fetch(url);

    if (!r.ok) {
      throw new Error('HTTP ' + r.status);
    }

    const data = await r.json();

    status('studentResult', data.message, !!data.success);

    if (data.success) {
      show('missionArea', true);
    }

  } catch (err) {
    status(
      'studentResult',
      '서버 연결을 확인해 주세요.',
      false
    );
    console.error(err);
  } finally {
    btn.disabled = false;
  }
});

// 학생 미션 제출
$('missionForm').addEventListener('submit', async e => {
  e.preventDefault();

  const btn = e.submitter;
  btn.disabled = true;

  status('submitResult', '제출 중...');

  try {
    const data = await post({
      action: 'submitMission',
      mission: Number($('missionNum').value),
      url: $('makecodeUrl').value.trim()
    });

    status('submitResult', data.message, !!data.success);

  } catch (err) {
    status(
      'submitResult',
      '응답을 확인하지 못했습니다. 다시 제출하기 전에 시트에 저장됐는지 확인해 주세요.',
      false
    );
    console.error(err);
  } finally {
    btn.disabled = false;
  }
});

// 도우미 로그인
$('helperForm').addEventListener('submit', async e => {
  e.preventDefault();

  const btn = e.submitter;
  btn.disabled = true;

  status('helperResult', '로그인 중...');

  try {
    const data = await post({
      action: 'helperLogin',
      accountId: $('accountId').value.trim(),
      password: $('helperPassword').value
    });

    if (!data.success) {
      status(
        'helperResult',
        data.message || '로그인 실패',
        false
      );
      return;
    }

    helperToken = data.token;
    helperClass = data.classNum;

    $('helperPassword').value = '';

    show('helperForm', false);
    show('helperDashboard', true);

    $('helperTitle').textContent =
      helperClass + '반 미션 검수 목록';

    await loadList();
    await loadSnackList();

  } catch (err) {
    status(
      'helperResult',
      '로그인 응답을 읽지 못했습니다.',
      false
    );
    console.error(err);
  } finally {
    btn.disabled = false;
  }
});

// 도우미 담당 반 미션 목록 조회
async function loadList() {
  if (!helperToken) return;

  status('listResult', '제출 목록 확인 중...');
  $('missionList').replaceChildren();

  try {
    const data = await post({
      action: 'helperMissionList',
      token: helperToken
    });

    if (!data.success) {
      status(
        'listResult',
        data.message || '조회 실패',
        false
      );

      if (/만료/.test(data.message || '')) {
        resetHelper();
      }
      return;
    }

    const items = data.missions || [];

    status(
      'listResult',
      items.length + '건 조회 완료',
      true
    );

    for (const item of items) {
      const card = document.createElement('div');
      card.className = 'item';

      const header = document.createElement('strong');
      header.textContent =
        item.number + '번 ' + item.name +
        ' · 미션 ' + item.mission +
        ' · ' + item.status;

      card.append(header);

      const p = document.createElement('p');
      const a = document.createElement('a');

      try {
        const u = new URL(item.url);

        if (
          u.protocol === 'https:' &&
          u.hostname === 'makecode.microbit.org'
        ) {
          a.href = u.href;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.textContent = 'MakeCode 코드 확인';
          p.append(a);
        } else {
          p.textContent = '공유 URL 확인 필요';
        }
      } catch {
        p.textContent = '공유 URL 확인 필요';
      }

     
card.append(p);

// 검수 버튼 영역
const actions = document.createElement('div');
actions.style.display = 'flex';
actions.style.gap = '8px';
actions.style.flexWrap = 'wrap';

const currentStatus = String(item.status || '');
const submissionId = String(item.submissionId || '');

function addReviewButton(label, reviewAction) {
  const button = document.createElement('button');

  button.type = 'button';
  button.textContent = label;
  button.style.flex = '1';
  button.style.minWidth = '90px';

  button.addEventListener('click', async () => {
    if (!confirm(
      item.number + '번 미션 ' + item.mission +
      '을(를) ' + label + ' 처리할까요?'
    )) {
      return;
    }

    // 처리 중 중복 클릭 방지
    actions.querySelectorAll('button').forEach(btn => {
      btn.disabled = true;
    });

    status('listResult', '검수 처리 중...');

    try {
      const result = await post({
        action: 'helperReviewMission',
        token: helperToken,
        submissionId: submissionId,
        reviewAction: reviewAction
      });

      if (result.success) {
        // 처리 후 서버에서 최신 목록 다시 조회
        await loadList();
      } else {
        status(
          'listResult',
          result.message || '검수 처리 실패',
          false
        );

        actions.querySelectorAll('button').forEach(btn => {
          btn.disabled = false;
        });
      }

    } catch (error) {
      console.error(error);

      status(
        'listResult',
        '검수 결과를 확인하지 못했습니다. 목록을 새로고침해 상태를 확인해 주세요.',
        false
      );

      // 결과를 알 수 없으므로 즉시 재처리하지 않도록 유지
    }
  });

  actions.append(button);
}

if (currentStatus === '대기') {
  addReviewButton('승인', 'approve');
  addReviewButton('재도전', 'retry');
}

if (
  currentStatus === '승인' ||
  currentStatus === '재도전'
) {
  addReviewButton('검수 취소', 'cancel');
}

card.append(actions);
$('missionList').append(card);

    }

  } catch (err) {
    status(
      'listResult',
      '목록을 불러오지 못했습니다.',
      false
    );
    console.error(err);
  }
}

// 도우미 화면 초기화
function resetHelper() {
  helperToken = '';
  helperClass = '';

  show('helperDashboard', false);
  show('helperForm', true);
  $('missionList').replaceChildren();
  $('snackList').replaceChildren();
}

// 목록 새로고침
$('refreshBtn').addEventListener('click', async () => {
  await loadList();
  await loadSnackList();
});

// 도우미 로그아웃
$('logoutBtn').addEventListener('click', async () => {
  const token = helperToken;

  resetHelper();
  status('helperResult', '로그아웃했습니다.', true);

  try {
    await post({
      action: 'helperLogout',
      token: token
    });
  } catch (err) {
    console.error('서버 로그아웃 응답 확인 실패', err);
    status(
      'helperResult',
      '화면에서 로그아웃했지만 서버 세션 종료를 확인하지 못했습니다.',
      false
    );
  }
});

  
/**
 * 담당 반 간식 지급 현황 조회
 */

let snackStudents = [];

/**
 * 서버에서 담당 반 간식 현황 가져오기
 */
async function loadSnackList() {
  if (!helperToken) return;

  status('snackResult', '간식 현황 확인 중...');

  try {
    const data = await post({
      action: 'helperSnackList',
      token: helperToken
    });

    if (!data.success) {
      status(
        'snackResult',
        data.message || '간식 현황 조회 실패',
        false
      );
      return;
    }

    snackStudents = (data.students || []).sort((a, b) => {
      const aDone = a.snackStatus === '지급완료';
      const bDone = b.snackStatus === '지급완료';

      const aReady = a.mission3Approved && !aDone;
      const bReady = b.mission3Approved && !bDone;

      const priority = s => {
        if (s.snackStatus === '지급완료') return 1;
        if (s.mission3Approved) return 0;
        return 2;
      };

      return priority(a) - priority(b) ||
        Number(a.number) - Number(b.number);
    });

    renderSnackList();

  } catch (error) {
    console.error(error);
    status(
      'snackResult',
      '간식 목록을 불러오지 못했습니다.',
      false
    );
  }
}

/**
 * 검색 및 필터 적용 후 학생 카드 표시
 */
function renderSnackList() {
  const keyword = $('snackSearch').value.trim().toLowerCase();
  const filter = $('snackFilter').value;

  const list = $('snackList');
  list.replaceChildren();

  const filtered = snackStudents.filter(student => {
    const matchesSearch =
      String(student.number).includes(keyword) ||
      String(student.name).toLowerCase().includes(keyword);

    const done = student.snackStatus === '지급완료';
    const ready = student.mission3Approved && !done;
    const progress = !student.mission3Approved && !done;

    const matchesFilter =
      filter === 'all' ||
      (filter === 'ready' && ready) ||
      (filter === 'done' && done) ||
      (filter === 'progress' && progress);

    return matchesSearch && matchesFilter;
  });

  status(
    'snackResult',
    '검색 결과 ' + filtered.length +
    '명 / 전체 ' + snackStudents.length + '명',
    true
  );

  if (filtered.length === 0) {
    const empty = document.createElement('p');
    empty.textContent = '해당하는 학생이 없습니다.';
    list.append(empty);
    return;
  }

  for (const student of filtered) {
    const card = document.createElement('div');
    card.className = 'item';

    const title = document.createElement('strong');
    title.textContent =
      student.number + '번 ' + student.name;

    const info = document.createElement('p');
    info.textContent =
      '미션 3: ' +
      (student.mission3Approved ? '승인' : '미승인') +
      ' / 간식: ' + student.snackStatus;

    card.append(title, info);

    let action = '';
    let label = '';

    if (student.snackStatus === '지급완료') {
      action = 'cancel';
      label = '지급 취소';
    } else if (student.mission3Approved) {
      action = 'give';
      label = '간식 지급 완료';
    }

    if (action) {
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = label;

      if (action === 'cancel') {
        button.className = 'secondary';
      }

      button.addEventListener('click', async () => {
        const confirmed = confirm(
          student.number + '번 ' + student.name +
          ' 학생의 간식을 ' + label + ' 처리할까요?'
        );

        if (!confirmed) return;

        button.disabled = true;
        status('snackResult', '간식 처리 중...');

        try {
          const result = await post({
            action: 'helperSnack',
            token: helperToken,
            studentId: student.studentId,
            snackAction: action
          });

          if (result.success) {
            // 검색어와 필터를 유지한 채 최신 목록 조회
            await loadSnackList();
          } else {
            status(
              'snackResult',
              result.message || '간식 처리 실패',
              false
            );
            button.disabled = false;
          }

        } catch (error) {
          console.error(error);
          status(
            'snackResult',
            '처리 결과를 확인하지 못했습니다. 새로고침 후 지급 상태를 확인해 주세요.',
            false
          );
          // 중복 지급 방지를 위해 버튼을 비활성 상태로 유지
        }
      });

      card.append(button);
    }

    list.append(card);
  }
}

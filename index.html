
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>EXIT CODE 연결 테스트</title>
</head>
<body>
  <h2>EXIT CODE - API 연결 테스트</h2>

  <button onclick="testConnection()">
    Google 서버 연결 확인
  </button>

  <p id="result">아직 테스트하지 않았습니다.</p>

  <script>
    // 본인의 Apps Script 웹앱 주소를 입력하세요.
    const API_URL = "https://script.google.com/macros/s/AKfycbzAtp31FIlNoPtN6Hd1ZsxPYZ3xyd-VMWTZXmTY8nmS_r-xQsw6lQedVDYXwJEF_1ms/exec";

    async function testConnection() {
      const result = document.getElementById("result");
      result.textContent = "연결 확인 중...";

      try {
        const response = await fetch(API_URL);
        const data = await response.json();

        result.textContent =
          data.success ? data.message : "서버 응답 오류";
      } catch (error) {
        result.textContent =
          "연결 실패: " + error.message;
        console.error(error);
      }
    }
  </script>
</body>
</html>

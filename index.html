<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>EXIT CODE 학생 입장 테스트</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 420px;
      margin: 50px auto;
      padding: 20px;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      font-size: 17px;
    }
    button {
      background: #245cdb;
      color: white;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
  
<section id="missionSubmit">
  <h3>미션 제출 테스트</h3>

  <label for="missionNum">미션 선택</label>
  <select id="missionNum">
    <option value="3">미션 3</option>
    <option value="4">미션 4</option>
    <option value="5">미션 5</option>
  </select>

  <p>
    <label for="makecodeUrl">MakeCode 공유 URL</label>
    <input
      id="makecodeUrl"
      type="url"
      placeholder="https://makecode.microbit.org/..."
      style="width: 95%; max-width: 500px;"
    >
  </p>

  <button id="submitMissionBtn" type="button">
    미션 제출
  </button>

  <p id="submitResult" aria-live="polite"></p>
</section>

<script>
document.getElementById('submitMissionBtn')
  .addEventListener('click', async function () {

    const button = this;
    const result = document.getElementById('submitResult');

    const data = {
      action: 'submitMission',
      mission: Number(
        document.getElementById('missionNum').value
      ),
      url: document.getElementById('makecodeUrl').value.trim()
    };

    if (!data.url) {
      result.textContent = 'MakeCode 공유 URL을 입력해 주세요.';
      return;
    }

    button.disabled = true;
    result.textContent = '제출 중입니다...';

    try {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8'
        },
        body: JSON.stringify(data),
        redirect: 'follow'
      });

      const json = await response.json();
      result.textContent = json.message;

    } catch (error) {
      console.error(error);
      result.textContent =
        '제출 결과를 확인하지 못했습니다. 다시 제출하기 전에 시트를 확인해 주세요.';
    } finally {
      button.disabled = false;
    }
  });
</script>

  
<section style="margin:20px 0;padding:15px;border:1px solid #ccc;">
  <h3>POST 통신 테스트</h3>
  <button id="pingBtn" type="button">통신 확인</button>
  <p id="pingResult" aria-live="polite"></p>
</section>

<script>
document.getElementById('pingBtn').addEventListener('click', async () => {
  const result = document.getElementById('pingResult');
  const button = document.getElementById('pingBtn');

  button.disabled = true;
  result.textContent = '통신 확인 중...';

  try {
    const response = await fetch(API_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'text/plain;charset=utf-8'
      },
      body: JSON.stringify({ action: 'ping' })
    });
 
    const data = await response.json();
    result.textContent = data.message || '응답 확인 완료';

  } catch (error) {
    console.error(error);
    result.textContent = '응답을 읽지 못했습니다.';
  } finally {
    button.disabled = false;
  }
});
</script>

<body>
  <h1>EXIT CODE</h1>
  <h2>학생 입장 테스트</h2>

  <label for="classNum">반</label>
  <input id="classNum" value="1">

  <label for="studentNum">번호</label>
  <input id="studentNum" value="99">

  <label for="studentName">이름</label>
  <input id="studentName" value="테스트학생">

  <button onclick="checkStudent()">입장 확인</button>
  <p id="result">입장 확인 버튼을 눌러주세요.</p>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzAtp31FIlNoPtN6Hd1ZsxPYZ3xyd-VMWTZXmTY8nmS_r-xQsw6lQedVDYXwJEF_1ms/exec";
    

    async function checkStudent() {
      const result = document.getElementById("result");
      result.textContent = "학생 정보 확인 중...";

      const url = new URL(API_URL);
      url.searchParams.set("action", "checkStudent");
      url.searchParams.set("classNum",
        document.getElementById("classNum").value);
      url.searchParams.set("studentNum",
        document.getElementById("studentNum").value);
      url.searchParams.set("studentName",
        document.getElementById("studentName").value);

      try {
        const response = await fetch(url.toString());
        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const data = await response.json();
        result.textContent = data.message;
        result.style.color =
          data.success ? "green" : "red";
      } catch (error) {
        result.textContent =
          "서버 연결 오류: " + error.message;
      }
    }
  </script>
</body>
</html>
